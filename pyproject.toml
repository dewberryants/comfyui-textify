[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textify"
version = "0.0.1"
description = "Turn pixel data into ascii art"
authors = [
  {name = "Dominik Behrens", email = "dewberryants@gmail.com"}
]
readme = "README.md"
license = {text = "BSD license"}
requires-python = ">=3.10"
classifiers = []
dependencies = [
]



[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
    "Pillow",
    "numpy"
]

[project.urls]
Repository = "https://github.com/dewberryants/comfyui-textify"
BugTracker = "https://github.com/dewberryants/comfyui-textify/issues"
Documentation = "https://github.com/dewberryants/comfyui-textify/wiki"


[tool.comfy]
PublisherId = "dewberryants"
DisplayName = "Textify"
Icon = ""
Tags = []
Repository = "https://github.com/dewberryants/comfyui-textify"

includes = []

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
